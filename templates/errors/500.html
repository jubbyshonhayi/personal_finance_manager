{% extends "base.html" %}

{% block title %}
    Something Went Wrong | Finora — Personal Finance Manager
{% endblock %}

{% block content %}
    <div class="page-header">
        <h1>Something went wrong</h1>

        <p>
            We couldn't complete your request.
            Please try again later.
        </p>

        <a
            class="button button-primary"
            href="{{ url_for('dashboard.dashboard_page') if session.get('user_id') else url_for('home.home_page') }}"
        >
            Back to Dashboard
        </a>
    </div>
{% endblock %}
