{% extends "base.html" %}

{% block title %}
    Reset Password | Finora — Personal Finance Manager
{% endblock %}

{% block head %}
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/auth.css') }}"
    >
{% endblock %}

{% block content %}
    <div class="auth-page">
        <section class="auth-card">
            <header class="page-header">
                <h1>Reset password</h1>

                <p>
                    Choose a new password for your account.
                </p>
            </header>

            <form
                method="POST"
                action="{{ url_for('auth.reset_password', token=token) }}"
            >
                <!-- Protects the form against cross-site request forgery. -->
                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >

                <div class="form-group">
                    <label for="password">
                        New Password
                    </label>

                    <div class="password-field">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            minlength="8"
                            maxlength="128"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="password"
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            Show
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm_password">
                        Confirm New Password
                    </label>

                    <div class="password-field">
                        <input
                            type="password"
                            id="confirm_password"
                            name="confirm_password"
                            minlength="8"
                            maxlength="128"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="confirm_password"
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            Show
                        </button>
                    </div>
                </div>

                <button
                    type="submit"
                    class="button button-primary"
                >
                    Reset Password
                </button>
            </form>

            <div class="auth-links">
                <a href="{{ url_for('auth.login') }}">
                    Back to Login
                </a>
            </div>
        </section>
    </div>
{% endblock %}

{% block scripts %}
    <script
        src="{{ url_for('static', filename='js/auth.js') }}"
    ></script>
{% endblock %}
