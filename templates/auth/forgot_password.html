{% extends "base.html" %}

{% block title %}
    Forgot Password | Personal Finance Manager
{% endblock %}

{% block head %}
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/auth.css') }}"
    >
{% endblock %}

{% block content %}
    <div class="auth-page">
        <section class="auth-card">
            <header class="page-header">
                <h1>Forgot your password?</h1>

                <p>
                    Enter your email address and we'll send you a
                    password-reset link.
                </p>
            </header>

            <form method="POST" data-processing-text="Sending...">
                <!-- Protects the form against cross-site request forgery. -->
                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >

                <div class="form-group">
                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        maxlength="254"
                        autocomplete="email"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="button button-primary"
                >
                    Send reset link
                </button>
            </form>

            <div class="auth-links">
                <a href="{{ url_for('auth.login') }}">
                    Back to Login
                </a>
            </div>
        </section>
    </div>
{% endblock %}
