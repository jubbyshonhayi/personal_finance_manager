{% extends "base.html" %}

{% block title %}
    Login | Personal Finance Manager
{% endblock %}

{% block head %}
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/auth.css') }}"
    >
{% endblock %}

{% block content %}
    <div class="auth-page">
        <section class="auth-card">
            <header class="page-header">
                <h1>Login</h1>

                <p>
                    Sign in to manage your finances.
                </p>
            </header>

            <form method="POST">
                <!-- Protects the form against cross-site request forgery. -->
                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >

                <div class="form-group">
                    <label for="identifier">
                        Username or Email
                    </label>

                    <input
                        type="text"
                        id="identifier"
                        name="identifier"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">
                        Password
                    </label>

                    <div class="password-field">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="password"
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            Show
                        </button>
                    </div>
                </div>

                <button
                    type="submit"
                    class="button button-primary"
                >
                    Login
                </button>
            </form>

            <div class="auth-links">
                <a href="{{ url_for('auth.forgot_password') }}">
                    Forgot your password?
                </a>

                <span>
                    Don't have an account?
                </span>

                <a href="{{ url_for('auth.register') }}">
                    Create an account
                </a>
            </div>
        </section>
    </div>
{% endblock %}

{% block scripts %}
    <script
        src="{{ url_for('static', filename='js/auth.js') }}"
    ></script>
{% endblock %}
