{% extends "base.html" %}

{% block title %}
    Edit Budget | Personal Finance Manager
{% endblock %}

{% block head %}
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/budgets.css') }}"
    >
{% endblock %}

{% block content %}
    <div class="budget-form-page">
        <section class="budget-form-card">
            <header class="budget-form-header">
                <h1>Edit Monthly Budget</h1>
                <p>
                    Update the category, currency, or monthly spending limit.
                </p>
            </header>

            <form method="POST" data-processing-text="Saving...">
                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >

                <div class="budget-form-group">
                    <label for="category_id">
                        Expense Category
                    </label>

                    <select
                        id="category_id"
                        name="category_id"
                        required
                    >
                        {% for category in categories %}
                            <option
                                value="{{ category.id }}"
                                {% if category.id == budget.category_id %}
                                    selected
                                {% endif %}
                            >
                                {{ category.category_name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="budget-form-group">
                    <label for="currency">
                        Currency
                    </label>

                    <select
                        id="currency"
                        name="currency"
                        required
                    >
                        {% for code, currency in currencies.items() %}
                            <option
                                value="{{ code }}"
                                {% if code == budget.currency %}
                                    selected
                                {% endif %}
                            >
                                {{ code }} - {{ currency.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="budget-form-group">
                    <label for="monthly_limit">
                        Monthly Limit
                    </label>

                    <div class="budget-input-with-hint">
                        <input
                            type="number"
                            id="monthly_limit"
                            name="monthly_limit"
                            min="0.01"
                            step="0.01"
                            inputmode="decimal"
                            value="{{ budget.monthly_limit }}"
                            required
                        >

                        <p>
                            This limit applies each month.
                        </p>
                    </div>
                </div>

                <button
                    type="submit"
                    class="button button-primary"
                >
                    Save Changes
                </button>
            </form>

            <a
                class="back-link"
                href="{{ url_for('budget.budgets_page') }}"
            >
                Cancel
            </a>
        </section>
    </div>
{% endblock %}
